<!doctype html>
<html lang="en">
<head>
  <!-- ===== HEAD: same block on every page (security, fonts, styles) ===== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self' mailto:; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Alpine Home Concept</title>
  <meta name="description" content="Sculptural coffee tables, dining tables and mirrors, handmade, selected and delivered from Belp, Switzerland.">
  <meta name="theme-color" content="#ecede8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="product">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <!-- ===== PRODUCT: filled by app.js renderProduct from ?id= ===== -->
    <article id="product" class="product"></article>
    <section id="related" class="section" aria-label="Related"></section>

    <!-- ===== CHECKOUT DIALOG: payment choice -> "coming soon" step ===== -->
    <dialog id="checkout"><div class="dialog-body"></div></dialog>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- ===== SCRIPTS: settings, data, texts, then the site logic ===== -->
  <script src="data/config.js"></script>
  <script src="data/products.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
