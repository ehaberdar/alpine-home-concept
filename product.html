<!doctype html>
<html lang="en">
<head>
  <!-- ===== HEAD: same block on every page (security, fonts, styles) ===== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self' mailto:; base-uri 'self'; object-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Alpine Home Concept</title>
  <meta name="description" content="Sculptural coffee tables, dining tables and mirrors, handmade, selected and delivered from Belp, Switzerland.">
  <meta name="theme-color" content="#ecede8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="product">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <header id="site-header" class="site-header">
    <!-- Plain links for visitors without JavaScript; app.js replaces this with the real menu -->
    <noscript><div class="wrap noscript-nav"><a href="index.html">Alpine Home Concept</a><a href="collection.html">Collection</a><a href="custom.html">Made to measure</a><a href="atelier.html">Atelier</a><a href="contact.html">Contact</a><a href="legal.html">Legal notice</a></div></noscript>
  </header>

  <main id="main">
    <!-- ===== PRODUCT: filled by app.js renderProduct from ?id= ===== -->
    <article id="product" class="product"><noscript><p class="wrap notice noscript-note">The product list needs JavaScript. You can also see every piece in our <a href="https://www.etsy.com/shop/AlpineHomeConcept" rel="noopener noreferrer">Etsy shop</a>.</p></noscript></article>
    <section id="related" class="section" aria-label="In the same category"></section>

    <!-- ===== CHECKOUT DIALOG: payment choice -> "coming soon" step ===== -->
    <dialog id="checkout"><div class="dialog-body"></div></dialog>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- ===== SCRIPTS: settings, data, texts, then the site logic ===== -->
  <script src="data/config.js"></script>
  <script src="data/products.js"></script>
  <script src="data/prices.js"></script>
  <script src="data/rates.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
