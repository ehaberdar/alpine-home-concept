<!doctype html>
<html lang="fr">
<head>
  <!-- ===== HEAD: same block on every page (security, fonts, styles) ===== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self' mailto:; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sur mesure · Alpine Home Concept</title>
  <meta name="description" content="Tables basses sculpturales, tables à manger et miroirs fabriqués à la main, sélectionnés et livrés depuis Belp, en Suisse.">
  <meta name="theme-color" content="#ecede8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="custom">
  <a class="skip-link" href="#main" data-i18n="skip">Aller au contenu</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <div class="wrap page-head">
      <h1 class="display" data-i18n="custom.title">Sur mesure</h1>
      <p class="lead measure" data-i18n="custom.lead"></p>
    </div>

    <div class="wrap grid prose-grid">
      <!-- ===== WHAT CAN BE ADAPTED ===== -->
      <div class="prose-aside">
        <h2 class="h3" data-i18n="custom.what.title"></h2>
        <ul class="muted">
          <li data-i18n="custom.what.1"></li>
          <li data-i18n="custom.what.2"></li>
          <li data-i18n="custom.what.3"></li>
        </ul>
        <h2 class="h3 custom-how" data-i18n="custom.how.title"></h2>
        <p class="muted" data-i18n="custom.how.text"></p>
      </div>

      <!-- ===== REQUEST FORM: opens the visitor's e-mail app (no data stored) ===== -->
      <div class="prose-main">
        <h2 class="h2" data-i18n="form.title">Votre demande</h2>
        <form id="custom-form" class="form" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="f-name" data-i18n="form.name">Nom</label>
              <input id="f-name" name="name" type="text" autocomplete="name" maxlength="120" data-required aria-describedby="f-name-error">
              <p id="f-name-error" class="error" hidden></p>
            </div>
            <div class="field">
              <label for="f-email" data-i18n="form.email">E-mail</label>
              <input id="f-email" name="email" type="email" autocomplete="email" maxlength="160" data-required aria-describedby="f-email-error">
              <p id="f-email-error" class="error" hidden></p>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="f-product" data-i18n="form.product">Modèle de départ</label>
              <select id="f-product" name="product"></select>
            </div>
            <div class="field">
              <label for="f-finish" data-i18n="form.finish">Finition</label>
              <input id="f-finish" name="finish" type="text" maxlength="120">
            </div>
          </div>
          <div class="field">
            <label for="f-dims" data-i18n="form.dims">Dimensions souhaitées</label>
            <input id="f-dims" name="dims" type="text" maxlength="120" aria-describedby="f-dims-hint">
            <p id="f-dims-hint" class="hint" data-i18n="form.dimsHint"></p>
          </div>
          <div class="field">
            <label for="f-message" data-i18n="form.message">Votre projet</label>
            <textarea id="f-message" name="message" maxlength="3000" data-required aria-describedby="f-message-error"></textarea>
            <p id="f-message-error" class="error" hidden></p>
          </div>
          <div>
            <button class="btn btn-primary" type="submit" data-i18n="form.submit">Préparer l'e-mail</button>
            <p class="small muted form-note" data-i18n="form.note"></p>
          </div>
          <p id="form-sent" class="notice" role="status" hidden></p>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- ===== SCRIPTS: settings, data, texts, then the site logic ===== -->
  <script src="data/config.js"></script>
  <script src="data/products.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
