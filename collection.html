<!doctype html>
<html lang="fr">
<head>
  <!-- ===== HEAD: same block on every page (security, fonts, styles) ===== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self' mailto:; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Collection · Alpine Home Concept</title>
  <meta name="description" content="Tables basses sculpturales, tables à manger et miroirs fabriqués à la main, sélectionnés et livrés depuis Belp, en Suisse.">
  <meta name="theme-color" content="#ecede8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="collection">
  <a class="skip-link" href="#main" data-i18n="skip">Aller au contenu</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <!-- ===== PAGE HEAD ===== -->
    <div class="wrap page-head">
      <h1 class="display" data-i18n="collection.title">Collection</h1>
      <p class="lead measure" data-i18n="collection.text">Chaque modèle existe en plusieurs finitions et tailles.</p>
    </div>

    <!-- ===== FILTERS + SORT (buttons built in app.js renderCollection) ===== -->
    <div class="wrap">
      <div class="controls">
        <div id="chips" class="chips" role="group" data-i18n-attr="aria-label:collection.filter"></div>
        <label class="sort"><span data-i18n="collection.sort">Trier</span>
          <select id="sort">
            <option value="default" data-i18n="sort.default">Sélection</option>
            <option value="priceAsc" data-i18n="sort.priceAsc">Prix croissant</option>
            <option value="priceDesc" data-i18n="sort.priceDesc">Prix décroissant</option>
          </select>
        </label>
      </div>
      <p id="result-count" class="small muted visually-hidden" aria-live="polite"></p>
      <div id="tiles" class="tiles"></div>
      <p id="empty" class="empty" data-i18n="collection.empty" hidden></p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- ===== SCRIPTS: settings, data, texts, then the site logic ===== -->
  <script src="data/config.js"></script>
  <script src="data/products.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
