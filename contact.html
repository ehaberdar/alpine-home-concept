<!doctype html>
<html lang="fr">
<head>
  <!-- ===== HEAD: same block on every page (security, fonts, styles) ===== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self' mailto:; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Contact · Alpine Home Concept</title>
  <meta name="description" content="Tables basses sculpturales, tables à manger et miroirs fabriqués à la main, sélectionnés et livrés depuis Belp, en Suisse.">
  <meta name="theme-color" content="#ecede8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="contact">
  <a class="skip-link" href="#main" data-i18n="skip">Aller au contenu</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <div class="wrap page-head">
      <h1 class="display" data-i18n="contact.title">Contact</h1>
      <p class="lead measure" data-i18n="contact.lead"></p>
    </div>
    <div class="wrap grid prose-grid">
      <div class="prose-aside">
        <p class="muted" data-i18n="contact.response"></p>
        <p class="muted contact-where" data-i18n="contact.where"></p>
      </div>
      <!-- ===== CONTACT DETAILS: from data/config.js ===== -->
      <dl id="contact-list" class="prose-main contact-list"></dl>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- ===== SCRIPTS: settings, data, texts, then the site logic ===== -->
  <script src="data/config.js"></script>
  <script src="data/products.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
